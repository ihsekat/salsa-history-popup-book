<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#243e34">
{{META}}
<link rel="icon" type="image/png" href="{{ASSET_ROOT}}art/book-mark.png?v=94aef816ddb0">
<link rel="preload" href="{{ASSET_ROOT}}art/young-serif.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="{{ASSET_ROOT}}style.css?v={{STYLE_VERSION}}">
</head>
<body>
<div class="book-surface">
<div id="reader" class="covered" role="region" aria-label="{{t|Interactive pop-up book}}" hidden>
  <section id="gate" aria-label="{{BOOK_TITLE}}" data-side="front">
    <p id="cover-subtitle">{{SUBTITLE}}</p>
    <div id="back-transcript" class="sr" hidden></div>
    <button id="cover-button" type="button" aria-label="{{t|Open Illustrated History of Salsa Dance}}">

    </button>
    <div id="cover-colophon">
      <div class="cover-actions">
        <button id="cover-prompt" type="button"><i data-icon="book"></i><span id="cover-action">{{t|Open the book}}</span></button>
        <button id="share-book" type="button" hidden><i data-icon="share"></i><span>{{t|Share this book}}</span></button>
      </div>
      <label id="manual-share" hidden>{{t|Copy this link}} <input type="url" readonly></label>
      <div class="cover-byline"><a id="cover-credit" href="{{CREDIT_URL}}" rel="noopener" target="_blank">{{CREDIT}}</a></div>
    </div>
    {{COVER_LANGUAGE}}
  </section>
  <div id="stage">
    <div id="edition" aria-hidden="true"><div id="paper-flip" aria-hidden="true" hidden><i></i></div></div>
    <div id="cover-film" aria-hidden="true" hidden></div>
    <canvas id="world" tabindex="0" aria-label="{{t|An open pop-up book. Select glowing objects to read their stories. Drag its pages to turn them. Drag the surrounding table to rotate. Use the left and right arrow keys to turn pages, A and D to rotate, and W and S to tilt. Pinch or use the plus and minus keys to zoom. R resets the view.}}"></canvas>
    <div id="scene-notes" role="group" aria-label="{{t|Explore objects on this page}}" hidden>
      <template id="note-button"><button type="button" class="scene-note" aria-haspopup="dialog"><span></span></button></template>
    </div>
  </div>
  <header class="tools">
    <a class="imprint" href="./" aria-label="{{BOOK_TITLE}}, {{t|Front cover.}}"><span class="tile"><img src="{{ASSET_ROOT}}art/book-mark.png?v=94aef816ddb0" width="39" height="39" alt=""></span><strong>{{BOOK_TITLE}}</strong></a>
    <nav aria-label="{{t|Book tools}}">
      <button id="reset" title="{{t|Reset view}}" aria-label="{{t|Reset view}}"><i data-icon="reset"></i><span>{{t|Reset view}}</span></button>
      <button id="sound" title="{{t|Turn paper sounds on}}" aria-label="{{t|Turn paper sounds on}}" aria-pressed="false"><i data-icon="mute"></i></button>
      {{CHAPTER_LANGUAGE}}
      <button id="contents" title="{{t|Chapters}}" aria-label="{{t|Chapters}}" aria-haspopup="dialog"><i data-icon="list"></i><span>{{t|Chapters}}</span></button>
    </nav>
  </header>
  <section class="chapter" aria-labelledby="title">
    <div class="eyebrow"><b id="folio">{{FOLIO}}</b></div>
    <h2 id="title">{{CHAPTER_TITLE}}</h2>
    <p id="place">{{CHAPTER_PLACE}}</p>
    <button id="listen" hidden></button>
  </section>
  <footer class="bottom">
    <section class="narration" aria-label="{{t|Chapter introduction}}"><div class="kicker"><i data-icon="feather"></i> {{t|In this chapter}}</div>
      <p id="line">{{CHAPTER_LINE}}</p>
      <button id="read" aria-haspopup="dialog">{{t|Read more}} <i data-icon="book"></i></button>
    </section>
    <div class="transport" aria-label="{{t|Turn the pages}}">
      <div class="rail-label"><span id="help">{{t|DRAG TO TURN · PINCH TO ZOOM}}</span><b id="counter">01 / 16</b></div>
      <div class="rail-row"><button id="prev" aria-label="{{t|Previous page}}" disabled><i data-icon="left"></i></button>
        <div class="rail"><div class="ticks"><i></i><i></i><i></i></div><input id="scrub" type="range" min="0" max="15" step=".01" value="0" aria-label="{{t|Turn the page slowly}}" aria-valuetext="{{PAGE_ONE}}"></div>
        <button id="next" aria-label="{{t|Next page}}"><i data-icon="right"></i></button>
      </div>
    </div>
  </footer>
</div>
  <div class="grain" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
</div>
<template id="chapter-share-controls"><div class="chapter-share">
  <button type="button">{{t|Share this chapter}}</button><span role="status"></span>
  <label hidden>{{t|Copy this link}} <input type="url" readonly></label>
</div></template>
<dialog id="dialog" aria-labelledby="dialog-title"><article class="sheet">
  <button id="close" aria-label="{{t|Close}}"><i data-icon="close"></i></button>
  <div id="sheet-body"></div>
</article></dialog>
<p class="sr" role="status" id="announce"></p>
{{READING_EDITION}}
{{SCRIPTS}}
</body></html>
